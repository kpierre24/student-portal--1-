name: Deploy Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Validate Migration Scripts & SQL Constraints
        run: |
          echo "Validating migration integrity and SQL constraints..."
          npm run db:validate-constraints
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://mock.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'mock-key' }}

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Migration Execution & Status Verification
        run: |
          echo "Executing migrations on production..."

          # Guard: skip if required secrets are not configured in repository
          if [ -z "$PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Supabase credentials (SUPABASE_PROJECT_ID, SUPABASE_DB_PASSWORD, SUPABASE_ACCESS_TOKEN) are not set. Skipping remote migration push."
            echo "Add them in Settings → Secrets and variables → Actions to enable automated database migration deployments."
            exit 0
          fi

          supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push

      - name: Verify Constraint Deployments
        run: |
          npm run db:validate-constraints
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://mock.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'mock-key' }}

      - name: Rollback Strategy
        if: failure()
        run: |
          echo "Migration failed or constraints invalid! Initiating rollback notice..."
          echo "Please ensure you have configured rollback or point-in-time recovery for critical databases."
