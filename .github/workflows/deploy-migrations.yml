name: Deploy Database Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  deploy-migrations:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Migration Validation
        run: |
          echo "Validating migrations against a local shadow database..."
          supabase db start
          supabase db lint
        
      - name: Migration Execution & Status Verification
        run: |
          echo "Executing migrations on production..."

          # Guard: fail with a clear message if required secrets are not configured
          if [ -z "$PROJECT_ID" ]; then
            echo "::warning::SUPABASE_PROJECT_ID secret is not set. Skipping migrations."
            echo "Add it in Settings → Secrets → Actions to enable automatic migrations."
            exit 0
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_DB_PASSWORD secret is not set. Skipping migrations."
            echo "Add it in Settings → Secrets → Actions to enable automatic migrations."
            exit 0
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret is not set. Skipping migrations."
            echo "Add it in Settings → Secrets → Actions to enable automatic migrations."
            exit 0
          fi

          supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db push

      - name: Verify Constraint Deployments
        run: |
          npm ci
          npm run db:validate-constraints
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://mock.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'mock-key' }}

      - name: Rollback Strategy
        if: failure()
        run: |
          echo "Migration failed or constraints invalid! Initiating rollback..."
          echo "Please ensure you have configured rollback or point-in-time recovery for critical databases."
          # If a specific migration needs to be rolled back manually, one can execute:
          # supabase migration down 1
